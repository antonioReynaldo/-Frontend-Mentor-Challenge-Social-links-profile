<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="profile">
    <img src="./assets/images/avatar-jessica.jpeg" alt="" class="profile__photo">
    <h2 class="profile__name">Jessica Randall</h2>
    <p class="profile__nationality">London, United Kingdom</p>
    <p class="profile__copy">"Front-end developer and avid reader."</p>
    <div class="profile__links">
      <a class="profile__link" href="#">GitHub</a>
      <a class="profile__link" href="#">Fronted Mentor</a>
      <a class="profile__link" href="#">LinkedIn</a>
      <a class="profile__link" href="#">Twitter</a>
      <a class="profile__link" href="#">Instagram</a>
    </div>
  </div>
</body>

</html>
